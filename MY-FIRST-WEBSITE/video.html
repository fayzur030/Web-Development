<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video</title>
  </head>
  <body>
    <h1>Audio and Video</h1>
    <audio controls src="media/goat.mp3"></audio>
    <br />
    <video autoplay controls src="media/video.mp4" width="800px"></video>
    <br />
    <h1>Video from link</h1>
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/C_8hcIpj5ks?si=qT7nEwnY5N0K55rR"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </body>
</html>
